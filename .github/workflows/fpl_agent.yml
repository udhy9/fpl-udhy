name: FPL Automated Manager

on:
  schedule:
    # Frequent cheap checks; Playwright + solver only run inside the T-90/T-60 window.
    # A 6-hour-only cron would miss most 75-minute pre-deadline windows.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - execute
      force:
        description: 'Force execution regardless of deadline time'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  fpl_manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Deadline gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG=""
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              FORCE_FLAG="--force"
            fi
            python main.py --gate-only --mode "${{ github.event.inputs.mode }}" $FORCE_FLAG
          else
            python main.py --gate-only --scheduled
          fi

      - name: Scheduled skip notice
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "Outside the T-90 dry-run / T-60 execute window. Playwright was not installed."
          echo "Countdown is in data/schedule.json. Manual run: Actions → Run workflow → force if needed."

      - name: Install Playwright
        if: steps.gate.outputs.run == 'true'
        run: playwright install chromium --with-deps

      - name: Run FPL Agent (${{ steps.gate.outputs.mode }})
        if: steps.gate.outputs.run == 'true'
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python main.py --mode "${{ steps.gate.outputs.mode }}" $FORCE_FLAG

      - name: Publish report summary
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f REPORT.md ]; then
            cat REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit report, schedule & snapshots
        run: |
          git config --global user.name "FPL AI Agent"
          git config --global user.email "bot@fpl-agent.ai"
          git add REPORT.md data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: GW schedule & team state [skip ci]" && git push)
